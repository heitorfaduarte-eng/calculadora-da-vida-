<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora da Vida</title>
<style>
 body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center;padding-top:70px}
 h1{color:#00ff88}
 input{padding:16px;font-size:22px;border-radius:14px;border:none;width:200px;text-align:center}
 button{padding:16px 32px;font-size:20px;background:#00ff88;border:none;border-radius:14px;font-weight:bold;margin-top:18px}
 #resultado{margin-top:30px;font-size:22px}
</style>
</head>
<body>
<h1>Calculadora da Vida</h1>
<script>
function calcular(){
  let idade = document.getElementById('idade').value;

  if(idade == ""){
    document.getElementById('resultado').innerHTML = "Digite sua idade né pae!";
    return;
  }

  idade = parseInt(idade);
  let anoAtual = new Date().getFullYear(); // 2026
  let anoNascimento = anoAtual - idade;

  // conta quantos anos bissextos teve
  let bissextos = 0;
  for(let ano = anoNascimento; ano <= anoAtual; ano++){
    if((ano % 4 == 0 && ano % 100 != 0) || (ano % 400 == 0)){
      bissextos++;
    }
  }

  let dias = (idade * 365) + bissextos;
  let horas = dias * 24;

  document.getElementById('resultado').innerHTML = `Você tem ${idade} anos<br>${dias} dias (já contando ${bissextos} anos bissextos)<br>${horas} horas vividas!`;
}
</script>
